spring.application.name=ledger-service-test

spring.datasource.url=jdbc:h2:mem:ledger_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Keep the test lightweight: don't require external DB/Liquibase.
spring.liquibase.enabled=false

# Let Hibernate create schema for context startup.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
